plugins {
    id 'java'
}

group = 'org.fantasyrpg'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly fileTree(dir: '../fantasyrpg-core/libs', include: ['*.jar'])

    testImplementation fileTree(dir: '../fantasyrpg-core/libs', include: ['*.jar'])
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile) { options.release = 17 }
tasks.named('test') {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'dragon_overhaul',
            'Specification-Vendor'    : 'FantasyRPG Team',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'FantasyRPG Team',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
